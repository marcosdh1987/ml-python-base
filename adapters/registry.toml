# =============================================================================
# Declarative tool registry — the single source of truth for every AI tool that
# consumes governed skills. Adding a new tool is ONE [[tool]] entry here (plus a
# template under adapters/templates/). Nothing in the Makefile needs to change.
#
# Consumed by: src/ml_python_base/skills_sync (run via `make sync-skills`).
# =============================================================================

schema_version = 1

# Selective synchronization contract. Governance paths are safe to project
# from an immutable template release. Platform paths are an ownership inventory
# only: they require a separate branch/PR and are never applied by governance
# sync because they can change the sync engine or repository structure itself.
[template_sync]
protocol = 1
governance_paths = [
    ".github/skills",
    ".github/skills-external",
    ".github/agents",
    ".github/architecture.md",
    ".github/standards.md",
    ".github/domain-boundaries.md",
    ".github/sdlc.md",
    ".github/orchestration.md",
    ".github/automation.md",
    ".github/portability.md",
    "adapters/templates",
]
platform_paths = [
    "src/ml_python_base/skills_sync",
    "scripts/template_sync.py",
    "scripts/init_project.py",
    "Makefile",
    "adapters/registry.toml",
    "pyproject.toml",
    "uv.lock",
]

# Governance files surfaced in every generated adapter region.
[governance]
files = [
    ".github/architecture.md",
    ".github/standards.md",
    ".github/domain-boundaries.md",
]
automation = ".github/automation.md"
orchestration = ".github/orchestration.md"

# --- Tools -------------------------------------------------------------------

[[tool]]
id = "claude"
display_name = "Claude Code"
native_skills_dir = ".claude/skills"
link_strategy = "symlink"            # symlink | copy | none
needs_manifest = false
adapter_file = "CLAUDE.md"
adapter_template = "claude.md.j2"
native_agents_dir = ".claude/agents"  # Claude Code native subagents
agent_format = "claude"               # claude | opencode | (empty = none)

[[tool]]
id = "opencode"
display_name = "OpenCode"
native_skills_dir = ".opencode/skills"
link_strategy = "symlink"
needs_manifest = false
adapter_file = "OPENCODE.md"
adapter_template = "opencode.md.j2"
native_agents_dir = ".opencode/agents"  # OpenCode native markdown agents (plural per docs)
agent_format = "opencode"

[[tool]]
id = "antigravity"
display_name = "Antigravity"
native_skills_dir = ".agents/skills"
link_strategy = "copy"               # cannot follow symlinks reliably
needs_manifest = true
manifest_path = ".agents/skills/.generated-manifest.tsv"
adapter_file = ".agents/rules/GEMINI.md"
adapter_template = "gemini.md.j2"
reference_prefix = "@"               # GEMINI uses @.github/... reference syntax

[[tool]]
id = "codex"
display_name = "Codex"
native_skills_dir = ".codex/skills"  # Codex @-mention skill picker reads from here
link_strategy = "symlink"            # same mechanism as claude/opencode
needs_manifest = false
adapter_file = "AGENTS.md"
adapter_template = "agents.md.j2"
native_agents_dir = ".codex/agents"  # Codex subagent TOML files
agent_format = "codex"               # emits .codex/agents/<name>.toml

[[tool]]
id = "copilot"
display_name = "GitHub Copilot"
native_skills_dir = ""
link_strategy = "none"
needs_manifest = false
adapter_file = ".github/copilot-instructions.md"
adapter_template = "copilot.md.j2"

# --- External skill provenance ------------------------------------------------
# Redistribution record for every vendored skill under `.github/skills-external/`.
# `make sync-skills` copies these fields into `skills-lock.json`; the human-readable
# counterpart is the root `NOTICE` file.
#
# A skill with no entry here renders as "UNKNOWN" in the lock. That is the signal to
# establish its origin BEFORE redistributing it — public availability is not a licence.
# Verified 2026-08-20 against the upstream repositories.

[external_skill.brainstorming]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.executing-plans]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.finishing-a-development-branch]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.requesting-code-review]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.subagent-driven-development]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.test-driven-development]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.using-git-worktrees]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.writing-plans]
upstream = "https://github.com/obra/superpowers"
license = "MIT"

[external_skill.ui-ux-pro-max]
upstream = "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
license = "MIT"

# Upstream ships no LICENSE file; the Public Domain dedication is stated in its
# README. The bundled reference text is Strunk (1918) via Project Gutenberg.
[external_skill.writing-clearly-and-concisely]
upstream = "https://github.com/obra/the-elements-of-style"
license = "Public Domain"

# First-party: generated from this repository's own slash commands, not vendored.
# They sit under skills-external/ for mechanical reasons in the sync engine.
[external_skill.source-command-retro]
upstream = "first-party"
license = "Apache-2.0"

[external_skill.source-command-verify]
upstream = "first-party"
license = "Apache-2.0"
