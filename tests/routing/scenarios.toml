# Versioned skill-routing scenarios.
#
# Each scenario states what the catalog should do with one user request. They
# run deterministically in CI through the reference router
# (ml_python_base.skills_sync.routing) and, opt-in, against a live model with
# `make routing-eval-live` (scripts/routing_eval.py).
#
# Fields:
#   id, tags            — tags cover: positive, negative, overlap, legacy,
#                         small-model, specialist, hidden
#   prompt              — the user request
#   expected_family     — family of the chosen skill ("" when none expected)
#   expected_skills     — any of these is a pass (empty + expect_none = no route)
#   forbidden_skills    — must not be chosen
#   expected_mode       — full | execute_only | local_model_32k (optional)
#   reason              — why this is the right routing
#   ambiguous_ok        — tolerate a tie at the top (default false)

schema_version = 1

[[scenario]]
id = "bug-keyerror"
tags = ["positive"]
prompt = "pytest fails with KeyError in repository.py"
expected_family = "quality-testing-debugging"
expected_skills = ["systematic_debugging"]
forbidden_skills = ["brainstorming", "brainstorm_quick", "plan_and_execute_feature"]
reason = "A failing test is a debugging loop, never a design gate."

